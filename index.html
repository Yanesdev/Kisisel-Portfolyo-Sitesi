<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zywexx</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.ico">
	 
    <style>
        :root {
            --primary-color: #ffffff;
            --accent-color: #B0B0FE;
            --glass-bg: rgba(255, 255, 255, 0.01);
            --glass-border: rgba(255, 255, 255, 0.15);
            --blur-amount: 15px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            background-color: #000;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000 !important;
            color: var(--primary-color);
            overflow-x: hidden;
            position: relative;
            transition: opacity 0.2s ease-in;
            min-height: 100vh;
        }

        body.no-scroll {
            overflow: hidden;
        }

        #enter-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 1s ease, visibility 1s;
        }

        #enter-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .enter-text {
            font-family: 'Poppins', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }

        /* ===== Arkaplan resmi: 'arkaplan.png' kullanılıyor. ===== */
        #bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            background-color: rgba(0, 0, 0, 0.4);
            background-image: url('arkaplan.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        /* ============================================================= */

            .overlay {
              position: fixed;
              top: 0;
              left: 0;
              width: 100vw;
              height: 100vh;
              background: rgba(0, 0, 0, 0.4);
              z-index: 1; /* DÜZELT */
              pointer-events: none;
        }

        .hero-section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            flex-direction: column;
            overflow: hidden;
            background: transparent;
        }

        .card {
            width: 650px;
            max-width: 90%;
            padding: 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.02), 0 20px 50px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 10;
            display: none;
            align-items: center;
            gap: 35px;
            text-align: left;
        }

        .profile-wrapper {
            flex-shrink: 0;
            width: 150px;
            height: 150px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 25px rgba(0, 242, 234, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }

        .content-right {
            flex-grow: 1;
            position: relative;
        }

        .name-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 5px;
            flex-wrap: wrap;
        }

        .username {
            font-family: 'Poppins', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #fff, var(--accent-color), #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 3s linear infinite;
            position: relative;
            display: inline-block;
            margin: 0;
        }

        .sparkle-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
            z-index: 1;
        }

        .sparkle {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 8px #fff, 0 0 12px var(--accent-color);
            animation: sparkle-anim 1.5s ease-out forwards;
        }

        @keyframes sparkle-anim {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            30% { opacity: 1; }
            100% { transform: scale(1) rotate(180deg) translateY(-15px); opacity: 0; }
        }

        .badges {
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 5;
        }

        .badge-icon {
            width: 26px;
            height: 26px;
            filter: drop-shadow(0 0 6px rgba(0, 242, 234, 0.7));
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .badge-icon:hover {
            transform: translateY(-5px) scale(1.3);
            filter: drop-shadow(0 0 12px rgba(0, 242, 234, 1));
        }

        #mute-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        #mute-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(176, 176, 254, 0.3);
        }

        .bio-text {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            min-height: 1.2em;
            display: block;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            background-color: var(--accent-color);
            margin-left: 3px;
            animation: blink 0.7s infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
            40% { transform: translateX(-50%) translateY(-10px); }
            60% { transform: translateX(-50%) translateY(-5px); }
        }

        .music-widget {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .music-widget:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .album-art {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.1);
        }

        .album-art.playing { animation: spin 8s linear infinite; }

        .track-info { flex: 1; min-width: 0; }

        .track-name {
            font-weight: 600;
            font-size: 0.85rem;
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .artist-name {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .music-controls {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        #play-btn {
            position: relative;
            z-index: 10;
            font-size: 18px;
            padding: 8px;
            cursor: pointer;
            pointer-events: auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            transition: all 0.3s ease;
        }

        #play-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(176, 176, 254, 0.3);
        }

        #play-btn:active { transform: scale(0.95); }

        .social-grid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .social-btn {
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .social-btn:hover { transform: translateY(-3px); }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        @keyframes shine { to { background-position: 200% center; } }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .card { flex-direction: column; text-align: center; width: 90%; padding: 30px 20px; }
            .name-container { justify-content: center; }
            .username { font-size: 1.8rem; }
            .social-grid { justify-content: center; }
        }

        @media (max-width: 480px) {
            .card { width: 95%; padding: 20px; gap: 20px; }
            .username { font-size: 1.5rem; }
            .profile-img { width: 120px; height: 120px; }
        }
    </style>
</head>
<body class="no-scroll">

    <div id="enter-screen">
        <div class="enter-text">Click to enter...</div>
    </div>

    <div id="mute-btn" title="Sesi aç/kapat">
        <i class="fa-solid fa-volume-high" id="mute-icon"></i>
    </div>

    <div id="bg-image"></div>
    <div class="overlay"></div>

    <section class="hero-section" id="hero">
        <div class="card" id="main-card">
            <div class="profile-wrapper">
                <img alt="Profile Picture" class="profile-img" id="profile-pic">
            </div>

            <div class="content-right">
                <div class="name-container">
                    <h1 class="username" id="username">
                        <div class="sparkle-container" id="sparkle-container"></div>
                    </h1>
                    <div class="badges" id="badge-container"></div>
                </div>

                <div class="bio-text">
                    <span id="typewriter"></span><span class="cursor">|</span>
                </div>

                <div class="music-widget" title="Müziği oynat/duraklat">
                    <img alt="Album Art" class="album-art" id="album-art">
                    <div class="track-info">
                        <span class="track-name" id="track-name">Yükleniyor...</span>
                        <span class="artist-name" id="artist-name">-</span>
                    </div>
                    <div class="music-controls">
                        <i class="fa-solid fa-play" id="play-btn" role="button" tabindex="0"></i>
                    </div>
                </div>

                <div class="social-grid" id="social-container"></div>
            </div>
        </div>

    </section>

    <audio id="audio-player" loop></audio>

    <script>
        // ============================================
        // KULLANICI AYARLARI
        // ============================================
        const kullaniciAyarlari = {
            isim: "Zywexx",
            bioMetni: "787 INC. XD",
            profilResmi: "profilResmi.jpg",
            rozetler: [
                "https://cdn3.emoji.gg/emojis/552821-xverified.png",
                "https://cdn3.emoji.gg/emojis/702380-developer.png",
            ],
            muzik: {
                dosyaLinki: "dosyaLinki.mp3",
                sarkiAdi: "Aslan yakışmaz kafeste",
                sanatci: "Keskin",
                kapakResmi: "kapakResmi.jpg"
            },
            sosyalMedya: [
                { ikon: "fa-brands fa-discord", link: "https://discord.gg/CUFXct9PNz", renk: "#5865F2" },
                { ikon: "fa-brands fa-spotify", link: "https://open.spotify.com/user/31ffxrzb7pa7qfb3xn4bzfqey754", renk: "#1DB954" },
                { ikon: "fa-brands fa-github", link: "https://github.com/Zywexx", renk: "#ffffff" },
                { ikon: "fa-solid fa-link", link: "https://guns.lol/Zywexx", renk: "#FFFFFF" }
            ]
        };

        // ============================================
        // DOM ELEMENTLERİ
        // ============================================
        const enterScreen = document.getElementById("enter-screen");
        const mainCard = document.getElementById("main-card");
        const audio = document.getElementById("audio-player");
        const muteBtn = document.getElementById("mute-btn");
        const muteIcon = document.getElementById("mute-icon");
        const playBtn = document.getElementById("play-btn");
        const albumArt = document.getElementById("album-art");

        // ============================================
        // TYPEWRITER EFFECT
        // ============================================
        function setupTypewriter() {
            const el = document.getElementById("typewriter");
            const text = kullaniciAyarlari.bioMetni;
            let i = 0;
            let isDeleting = false;
            let speed = 100;

            function type() {
                if (isDeleting) {
                    el.textContent = text.substring(0, i - 1);
                    i--;
                    speed = 50;
                } else {
                    el.textContent = text.substring(0, i + 1);
                    i++;
                    speed = 100;
                }

                if (!isDeleting && i === text.length) {
                    isDeleting = true;
                    speed = 2000;
                } else if (isDeleting && i === 0) {
                    isDeleting = false;
                    speed = 500;
                }

                setTimeout(type, speed);
            }
            type();
        }

        // ============================================
        // SPARKLE ANIMATION
        // ============================================
        function initSparkles() {
            const container = document.getElementById("sparkle-container");
            container.innerHTML = '';

            setInterval(() => {
                const sparkle = document.createElement("div");
                sparkle.className = "sparkle";
                const size = (Math.random() * 4 + 1) + "px";
                sparkle.style.width = size;
                sparkle.style.height = size;
                sparkle.style.left = (Math.random() * 100) + "%";
                sparkle.style.top = (Math.random() * 100) + "%";
                container.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 1500);
            }, 100);
        }

        // ============================================
        // IMAGE LOADING HELPER
        // ============================================
        function loadImageWithFallback(img, src, fallbackSrc) {
            if (!src) {
                img.src = fallbackSrc;
                return;
            }

            img.onerror = () => {
                console.warn("Görsel yüklenemedi: " + src + ", Yedek kullanılıyor: " + fallbackSrc);
                img.src = fallbackSrc;
            };

            img.src = src;
        }

        // ============================================
        // UTILITY
        // ============================================
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function toggleMusic() {
            if (audio.paused) {
                audio.play().catch(err => console.warn("Müzik oynatılamadı:", err.message));
                playBtn.classList.replace("fa-play", "fa-pause");
                albumArt.classList.add("playing");
            } else {
                audio.pause();
                playBtn.classList.replace("fa-pause", "fa-play");
                albumArt.classList.remove("playing");
            }
        }

        // ============================================
        // DOM READY
        // ============================================
        document.addEventListener("DOMContentLoaded", () => {
            // Username
            const usernameEl = document.getElementById("username");
            const sparkleContainer = document.getElementById("sparkle-container");
            usernameEl.innerHTML = '';
            usernameEl.appendChild(sparkleContainer);
            usernameEl.appendChild(document.createTextNode(kullaniciAyarlari.isim));

            // Profil resmi
            loadImageWithFallback(
                document.getElementById("profile-pic"),
                kullaniciAyarlari.profilResmi,
                "https://i.pravatar.cc/150?u=zywexx"
            );

            // Albüm kapağı
            loadImageWithFallback(
                document.getElementById("album-art"),
                kullaniciAyarlari.muzik.kapakResmi,
                "https://picsum.photos/40/40?random=music"
            );

            // Müzik
            if (kullaniciAyarlari.muzik.dosyaLinki) {
                audio.src = kullaniciAyarlari.muzik.dosyaLinki;
                audio.onerror = () => console.warn("Müzik dosyası yüklenemedi");
            }
            document.getElementById("track-name").textContent = kullaniciAyarlari.muzik.sarkiAdi;
            document.getElementById("artist-name").textContent = kullaniciAyarlari.muzik.sanatci;

            // Animasyonlar
            initSparkles();
            setupTypewriter();

            // Rozetler
            const badgeContainer = document.getElementById("badge-container");
            kullaniciAyarlari.rozetler.forEach((url, i) => {
                const img = document.createElement("img");
                img.className = "badge-icon";
                img.alt = "Badge " + (i + 1);
                loadImageWithFallback(img, url, "https://via.placeholder.com/26/B0B0FE/B0B0FE?text=Badge");
                badgeContainer.appendChild(img);
            });

            // Sosyal medya
            const socialContainer = document.getElementById("social-container");
            kullaniciAyarlari.sosyalMedya.forEach(item => {
                const link = document.createElement("a");
                link.href = item.link;
                link.className = "social-btn";
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.innerHTML = "<i class='" + item.ikon + "'></i>";
                link.addEventListener("mouseenter", () => {
                    link.style.background = item.renk;
                    link.style.boxShadow = "0 0 15px " + item.renk;
                });
                link.addEventListener("mouseleave", () => {
                    link.style.background = "rgba(255, 255, 255, 0.05)";
                    link.style.boxShadow = "none";
                });
                socialContainer.appendChild(link);
            });

            // Event listeners
            enterScreen.addEventListener("click", () => {
                enterScreen.classList.add("fade-out");
                document.body.classList.remove("no-scroll");
                mainCard.style.display = "flex";

                if (audio.src) {
                    audio.volume = 0.5;
                    audio.play().catch(() => console.warn("Otomatik oynatma engellendi"));
                    playBtn.classList.replace("fa-play", "fa-pause");
                    albumArt.classList.add("playing");
                }
            });

            muteBtn.addEventListener("click", () => {
                audio.muted = !audio.muted;
                muteIcon.classList.toggle("fa-volume-high", !audio.muted);
                muteIcon.classList.toggle("fa-volume-xmark", audio.muted);
            });

            playBtn.addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                toggleMusic();
            });

            playBtn.addEventListener("keypress", (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleMusic();
                }
            });
        });
    </script>
</body>
</html>
